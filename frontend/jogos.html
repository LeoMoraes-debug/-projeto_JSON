<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consulta de jogos</title>
    <style>
        :root {
            --fundo: #12261c;
            --painel: #1c3a2b;
            --texto: #eef8f1;
            --texto-suave: #a9c9b6;
            --destaque: #3ddc84;
            --apoio: #9af2bd;
            --alerta: #ffb454;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 8vh 20px 40px;
            background: var(--fundo);
            color: var(--texto);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        main {
            width: 100%;
            max-width: 560px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 2.2rem;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .subtitulo {
            margin: 0 0 28px;
            color: var(--texto-suave);
        }

        form {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 14px 16px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: var(--painel);
            color: var(--texto);
            font-size: 1rem;
        }

        input[type="text"]::placeholder { color: var(--texto-suave); }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--apoio);
        }

        input[type="submit"] {
            padding: 14px 22px;
            border: 0;
            border-radius: 10px;
            background: var(--destaque);
            color: #0e2118;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="submit"]:hover { filter: brightness(1.1); }

        input[type="submit"]:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        input[type="submit"]:focus-visible,
        .limpar:focus-visible {
            outline: 3px solid var(--apoio);
            outline-offset: 2px;
        }

        /* cartão de resultado (também usado se a página for enviada sem JavaScript) */
        .resultado,
        .item {
            padding: 20px 22px;
            border-left: 5px solid var(--apoio);
            border-radius: 0 10px 10px 0;
            background: var(--painel);
            font-size: 1.05rem;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .resultado { margin-top: 28px; }

        /* some quando ainda não há resultado */
        .resultado:empty { display: none; }

        .nota {
            display: block;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--fundo);
            font-size: 2.2rem;
            font-weight: bold;
            line-height: 1.1;
            color: var(--destaque);
        }

        .nota::before {
            content: "Nota";
            display: block;
            margin-bottom: 4px;
            font-size: 0.9rem;
            font-weight: normal;
            color: var(--texto-suave);
        }

        /* contador e botão de limpar */
        .barra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 28px;
            color: var(--texto-suave);
        }

        .barra[hidden] { display: none; }

        .limpar {
            padding: 6px 14px;
            border: 1px solid var(--texto-suave);
            border-radius: 8px;
            background: transparent;
            color: var(--texto-suave);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .limpar:hover {
            border-color: var(--texto);
            color: var(--texto);
        }

        /* lista de pesquisas com barra de rolagem vertical */
        .historico {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 420px;
            margin-top: 12px;
            padding-right: 8px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--destaque) var(--painel);
        }

        .historico:empty { display: none; }

        .item { flex-shrink: 0; }

        .item.erro {
            border-left-color: var(--alerta);
            color: var(--alerta);
        }

        @media (max-width: 480px) {
            form { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Consulta de jogos</h1>
        <p class="subtitulo">Digite o nome e veja lançamento, gêneros e nota.</p>

        <form action="backend/jogos.php" method="post">
            <input name="jogo" type="text" placeholder="Digite o nome do jogo" required autofocus autocomplete="off">
            <input value="Consultar" type="submit">
        </form>

        <div class="resultado">#dados</div>

        <div class="barra" hidden>
            <span class="contador"></span>
            <button type="button" class="limpar">Limpar lista</button>
        </div>
        <div class="historico" aria-live="polite"></div>
    </main>

    <script>
        const form = document.querySelector("form");
        const campo = form.querySelector('input[name="jogo"]');
        const botao = form.querySelector('input[type="submit"]');
        const historico = document.querySelector(".historico");
        const barra = document.querySelector(".barra");
        const contador = document.querySelector(".contador");
        const limpar = document.querySelector(".limpar");

        function atualizarBarra() {
            const total = historico.children.length;
            barra.hidden = total === 0;
            contador.textContent = total + (total === 1 ? " jogo pesquisado" : " jogos pesquisados");
        }

        // O PHP imprime a nota depois de um <br>. Aqui ela é isolada
        // e recebe a classe "nota", sem mexer no back end.
        function destacarNota(item) {
            const quebra = item.querySelector("br");
            if (!quebra || !quebra.nextSibling) return;

            const valor = quebra.nextSibling.textContent.trim();
            if (valor === "") return;

            const nota = document.createElement("span");
            nota.className = "nota";
            nota.textContent = isNaN(valor) ? valor : "★ " + valor + " / 5";

            quebra.nextSibling.remove();
            quebra.replaceWith(nota);
        }

        function adicionar(conteudo, ehErro) {
            const item = document.createElement("div");
            item.className = ehErro ? "item erro" : "item";

            if (typeof conteudo === "string") {
                item.textContent = conteudo;
            } else {
                conteudo.childNodes.forEach(function (no) {
                    item.append(document.importNode(no, true));
                });
                destacarNota(item);
            }

            // a pesquisa mais recente fica no topo da lista
            historico.prepend(item);
            historico.scrollTop = 0;
            atualizarBarra();
        }

        form.addEventListener("submit", async function (evento) {
            evento.preventDefault();
            if (campo.value.trim() === "") return;

            botao.disabled = true;
            botao.value = "Buscando...";

            try {
                // envia o mesmo formulário para o jogos.php, sem recarregar a página
                const resposta = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form)
                });
                const html = await resposta.text();
                const doc = new DOMParser().parseFromString(html, "text/html");
                const resultado = doc.querySelector(".resultado");

                if (resultado && resultado.textContent.trim() !== "") {
                    adicionar(resultado, false);
                } else {
                    adicionar(doc.body.textContent.trim() || "Não foi possível consultar o jogo.", true);
                }
            } catch (erro) {
                adicionar("Não foi possível conectar ao servidor. Confira se o XAMPP está ligado.", true);
            } finally {
                botao.disabled = false;
                botao.value = "Consultar";
                campo.value = "";
                campo.focus();
            }
        });

        limpar.addEventListener("click", function () {
            historico.replaceChildren();
            atualizarBarra();
            campo.focus();
        });
    </script>
</body>
</html>
